<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Routine</title>
    <!-- Content Security Policy to harden execution -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; media-src 'self'; img-src 'self' data:;">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        calmGreen: '#22c55e',
                        transitionOrange: '#f97316',
                        alertRed: '#ef4444',
                        backgroundDark: '#0f172a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            background-color: #0f172a;
            color: white;
            overflow: hidden; /* No scrolling on TV */
            user-select: none; /* No text selection */
            margin: 0;
            padding: 0;
        }
        
        /* The giant SVG Ring */
        .progress-ring {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 1s linear, stroke 0.5s ease-in-out;
        }

        /* Action button focus state for TV D-pad */
        #action-btn:focus, #start-btn:focus {
            outline: 6px solid white;
            outline-offset: 8px;
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255,255,255,0.4);
        }
        
        #action-btn.undo-state {
            background-color: #ef4444; /* red for undo */
        }

        /* Fullscreen Confetti Canvas */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="absolute inset-0 overflow-hidden flex flex-col bg-slate-900 font-sans text-white select-none m-0 p-0">
    <canvas id="confetti-canvas"></canvas>

    <!-- Macro Anchor (Header) -->
    <header id="macro-anchor" class="w-full flex justify-between items-center px-[4vmin] py-[2vmin] bg-slate-900 border-b-4 border-slate-700 shadow-2xl z-10 transition-colors duration-1000 shrink-0">
        <div class="flex flex-col">
            <span class="text-[2vmin] text-slate-400 font-bold uppercase tracking-widest">Current Time</span>
            <span id="current-time-display" class="text-[6vmin] font-black leading-none tracking-tighter">--:--</span>
        </div>
        
        <!-- Deficit indicator -->
        <div id="deficit-indicator" class="hidden bg-red-600 px-[3vmin] py-[1.5vmin] rounded-3xl animate-pulse shadow-[0_0_30px_rgba(239,68,68,0.6)] max-w-[40%] text-center">
            <span id="deficit-text" class="text-[3.5vmin] font-black text-white tracking-wide">Behind Schedule</span>
        </div>

        <div class="flex flex-col text-right">
            <span class="text-[2vmin] text-slate-400 font-bold uppercase tracking-widest">Time to Leave House</span>
            <span id="macro-countdown-display" class="text-[6vmin] font-black leading-none tracking-tighter text-blue-400 drop-shadow-md">--:--</span>
        </div>
    </header>

    <!-- Main Content Area (Single Task Focus) -->
    <main class="flex-grow flex flex-col items-center justify-evenly relative w-full z-10 px-[4vmin] py-[2vmin]">
        
        <div id="pre-start-container" class="flex flex-col items-center w-full">
            <h1 class="text-[8vmin] font-black text-center mb-[4vmin] drop-shadow-xl text-white tracking-tight">Morning Routine</h1>
            <h2 id="target-start-time" class="text-[4vmin] text-slate-300 mb-[10vmin] font-bold">Target Start: --:--</h2>
            <button id="start-btn" class="bg-blue-600 text-white font-black text-[5vmin] px-[8vmin] py-[3vmin] rounded-full transition-all duration-300">
                START ROUTINE
            </button>
        </div>

        <div id="task-container" class="hidden flex-col items-center justify-evenly w-full h-full relative">
            
            <h2 id="current-task-title" class="text-[7vmin] font-black text-center leading-tight w-[90%] mx-auto drop-shadow-2xl tracking-tight text-white m-0">
                Loading Task...
            </h2>

            <!-- SVG Timer Ring -->
            <div class="relative flex items-center justify-center">
                <svg class="progress-ring w-[45vmin] h-[45vmin]" viewBox="0 0 120 120">
                    <circle class="text-slate-800" stroke-width="8" stroke="currentColor" fill="transparent" r="54" cx="60" cy="60"/>
                    <circle id="task-progress-ring" class="progress-ring__circle text-calmGreen drop-shadow-[0_0_15px_rgba(34,197,94,0.5)]" stroke-width="8" stroke-dasharray="339.292" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="54" cx="60" cy="60"/>
                </svg>
                <div class="absolute flex flex-col items-center justify-center mt-[1vmin]">
                    <span id="task-countdown" class="text-[12vmin] font-black font-mono leading-none tracking-tighter drop-shadow-2xl text-white">--:--</span>
                    <span id="task-duration-label" class="text-[3vmin] text-slate-400 font-bold mt-1">/ --:--</span>
                </div>
            </div>

            <!-- Focused Action Button -->
            <button id="action-btn" class="bg-slate-700 text-white font-black text-[4.5vmin] px-[8vmin] py-[2.5vmin] rounded-[3vmin] transition-all duration-300 shadow-2xl tracking-wide shrink-0">
                COMPLETE TASK
            </button>
        </div>
        
        <div id="completion-container" class="hidden flex-col items-center justify-center w-full h-full">
            <h1 class="text-[10vmin] font-black text-center mb-[4vmin] text-calmGreen drop-shadow-[0_0_40px_rgba(34,197,94,0.8)] tracking-tighter">ROUTINE COMPLETE</h1>
            <h2 class="text-[6vmin] text-white font-bold drop-shadow-xl">Time to leave!</h2>
        </div>
        
    </main>

    <script src="app.js"></script>
</body>
</html>
